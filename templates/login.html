<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — EcoPackAI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="container" style="max-width: 450px; z-index: 1;">
  <div class="text-center mb-4">
    <a href="/" class="text-decoration-none d-inline-block">
      <h2 class="fw-bold text-success display-6 mb-1"><i class="fas fa-leaf me-2 text-success"></i>EcoPackAI</h2>
    </a>
    <p class="text-muted small">AI-Powered Sustainable Packaging Intelligence</p>
  </div>

  <div class="eco-card">
    <div class="eco-card-header text-center justify-content-center py-3">
      <i class="fas fa-lock me-2"></i>Sign In
    </div>
    <div class="eco-card-body p-4">
      
      <!-- Flash Messages -->
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{% if category == 'error' %}danger{% else %}{{ category }}{% endif %} alert-dismissible fade show mb-3" role="alert" style="background: rgba(220, 53, 69, 0.1); border-color: rgba(220, 53, 69, 0.2); color: #f88; font-size: 0.85rem;">
              <i class="fas fa-exclamation-circle me-2"></i>{{ message }}
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" style="font-size: 0.75rem; padding: 1rem;"></button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('login_page') }}" method="POST">
        <div class="mb-3">
          <label for="email" class="form-label eco-label">Email Address</label>
          <input type="email" name="email" id="email" class="form-control eco-input w-100" placeholder="name@company.com" required autocomplete="email"/>
        </div>

        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label eco-label mb-0">Password</label>
          </div>
          <input type="password" name="password" id="password" class="form-control eco-input w-100" placeholder="••••••••" required autocomplete="current-password"/>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input bg-transparent border-secondary" type="checkbox" name="remember" id="remember" style="cursor: pointer;"/>
          <label class="form-check-label text-muted small" for="remember" style="cursor: pointer; user-select: none;">
            Remember me on this device
          </label>
        </div>

        <button type="submit" class="btn eco-btn-primary w-100 py-2 fw-semibold mb-3">
          <i class="fas fa-sign-in-alt me-2"></i>Login
        </button>

        <div class="text-center mt-3">
          <span class="text-muted small">New to EcoPackAI?</span>
          <a href="{{ url_for('signup_page') }}" class="text-success text-decoration-none small fw-semibold ms-1">Create an account</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
